<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FROSTYDBOT - Loading...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            font-weight: bold;
        }
        
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 16px;
        }
        
        .status {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .status-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            font-size: 14px;
            color: #555;
        }
        
        .status-item:last-child {
            margin-bottom: 0;
        }
        
        .status-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: white;
            font-weight: bold;
        }
        
        .status-icon.success {
            background: #4caf50;
        }
        
        .status-icon.loading {
            background: #ff9800;
            animation: spin 1s linear infinite;
        }
        
        .status-icon.error {
            background: #f44336;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        .version {
            color: #999;
            font-size: 12px;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">⚡</div>
        <h1>FROSTYDBOT</h1>
        <p>Your Visual Trading Bot Builder</p>
        
        <div class="status">
            <div class="status-item">
                <div class="status-icon success">✓</div>
                <span>Server is running on port 4003</span>
            </div>
            <div class="status-item">
                <div class="status-icon loading" id="build-status">⏳</div>
                <span id="build-text">Application build in progress...</span>
            </div>
            <div class="status-item">
                <div class="status-icon" id="api-status">?</div>
                <span>Ready to connect</span>
            </div>
        </div>
        
        <p id="message" style="font-size: 14px; color: #ff9800; font-weight: 500; margin: 20px 0;">
            ⚙️ Setting up your trading environment...
        </p>
        
        <button class="button" onclick="location.reload()">Refresh Page</button>
        
        <div class="version">v0.2.0 - Frostydbot Trading Bot</div>
    </div>
    
    <script>
        // Try to load the actual app every 2 seconds
        function attemptLoad() {
            fetch('/static/js/lib-react.76728b5f.js', { method: 'HEAD' })
                .then(response => {
                    if (response.ok) {
                        document.getElementById('build-status').className = 'status-icon success';
                        document.getElementById('build-status').textContent = '✓';
                        document.getElementById('build-text').textContent = 'Application ready!';
                        document.getElementById('message').innerHTML = '✨ Application is ready. Reloading...';
                        setTimeout(() => location.reload(), 2000);
                    }
                })
                .catch(() => {
                    // Still loading
                });
        }
        
        // Check every 2 seconds
        setInterval(attemptLoad, 2000);
        
        // Initial check
        attemptLoad();
        
        // Log current status
        console.log('FROSTYDBOT Server is running at http://localhost:5173');
        console.log('Waiting for application build to complete...');
    </script>
</body>
</html>
